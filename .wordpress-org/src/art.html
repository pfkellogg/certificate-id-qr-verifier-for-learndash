<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
#icon,#banner{display:none}.show{display:block!important}
</style></head><body>
<!-- the motif: a certificate with a QR code, and a green "verified" check -->
<svg id="icon" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4d7a"/><stop offset="1" stop-color="#14294a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d98f"/><stop offset=".5" stop-color="#c29436"/><stop offset="1" stop-color="#a77a26"/></linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <g transform="translate(30,46)">
    <rect width="196" height="140" rx="10" fill="#fffaf0"/>
    <rect x="7" y="7" width="182" height="126" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="34" y="24" width="128" height="11" rx="5.5" fill="#1f3a5f"/>
    <rect x="52" y="44" width="92" height="8" rx="4" fill="#c29436"/>
    <rect x="22" y="68" width="76" height="6" rx="3" fill="#1f3a5f" opacity=".35"/>
    <rect x="22" y="82" width="60" height="6" rx="3" fill="#1f3a5f" opacity=".35"/>
    <g transform="translate(120,62)" fill="#1f3a5f">
      <rect width="58" height="58" rx="3" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
      <rect x="5" y="5" width="16" height="16"/><rect x="9" y="9" width="8" height="8" fill="#fff"/><rect x="11" y="11" width="4" height="4"/>
      <rect x="37" y="5" width="16" height="16"/><rect x="41" y="9" width="8" height="8" fill="#fff"/><rect x="43" y="11" width="4" height="4"/>
      <rect x="5" y="37" width="16" height="16"/><rect x="9" y="41" width="8" height="8" fill="#fff"/><rect x="11" y="43" width="4" height="4"/>
      <rect x="25" y="6" width="5" height="5"/><rect x="27" y="15" width="5" height="5"/><rect x="25" y="26" width="5" height="5"/><rect x="33" y="27" width="5" height="5"/><rect x="43" y="26" width="5" height="5"/><rect x="25" y="38" width="5" height="5"/><rect x="34" y="43" width="5" height="5"/><rect x="45" y="37" width="5" height="5"/><rect x="40" y="48" width="5" height="5"/><rect x="27" y="48" width="5" height="5"/><rect x="6" y="27" width="5" height="5"/><rect x="15" y="27" width="5" height="5"/>
    </g>
  </g>
  <g transform="translate(176,168)">
    <circle r="38" fill="#16a34a" stroke="#fff" stroke-width="7"/>
    <path d="M-17 1 l11 11 l22 -24" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<div id="banner" style="width:1544px;height:500px;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 40%,#2f5a8f 0%,#1f3a5f 45%,#122640 100%)">
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(241,217,143,.08) 2px,transparent 2px);background-size:34px 34px"></div>
  <div style="position:absolute;left:96px;top:70px;color:#fff;width:720px">
    <div style="font-size:26px;font-weight:800;letter-spacing:3px;color:#f1d98f;text-transform:uppercase">Free · Open source · For LearnDash</div>
    <div style="font-size:70px;font-weight:900;line-height:1.02;margin-top:14px;letter-spacing:-2px">Certificate ID<br>&amp; QR Verifier</div>
    <div style="font-size:33px;margin-top:20px;line-height:1.3;color:#e3ebf6">Scan any certificate. Know it's genuine,<br>current, and approved.</div>
    <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
      <span style="font-size:21px;font-weight:700;padding:8px 16px;border-radius:30px;background:#f1d98f;color:#1f3a5f">QR code, no setup</span>
      <span style="font-size:21px;font-weight:700;padding:8px 16px;border-radius:30px;border:2px solid #f1d98f;color:#f1d98f">Expires on schedule</span>
      <span style="font-size:21px;font-weight:700;padding:8px 16px;border-radius:30px;border:2px solid #f1d98f;color:#f1d98f">ELC compatible</span>
    </div>
  </div>
  <img src="cert.png" style="position:absolute;left:840px;top:58px;width:520px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 30px 60px rgba(0,0,0,.45)">
  <div style="position:absolute;left:1262px;top:96px;width:214px;height:420px;border-radius:34px;background:#0b1626;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(5deg)">
    <div style="width:100%;height:100%;border-radius:26px;overflow:hidden;background:#eef2f7"><img src="verified.png" style="width:100%"></div>
  </div>
</div>
<script>document.getElementById(new URLSearchParams(location.search).get('a')).classList.add('show')</script>
</body></html>
